<!doctype html><meta charset="utf-8"><title>bis check</title>
<body><pre id="out">RUNNING</pre>
<script>window.BIS_NO_INIT = true; window.onerror = function (m, s, l) { document.getElementById("out").textContent = "ERROR " + m + " @" + l; };</script>
<script src="../../bis/bis.js"></script>
<script>
(function () {
  var out = [], fails = 0, B = window.BisLive;
  function eq(name, got, want) {
    var ok = JSON.stringify(got) === JSON.stringify(want);
    if (!ok) fails++;
    out.push((ok ? "PASS " : "FAIL ") + name + (ok ? "" : "\n   got  " + JSON.stringify(got) + "\n   want " + JSON.stringify(want)));
  }
  function row(id, no, ends, c1, c2) {
    return '<tr id="' + id + '_' + id + '"><th><p><span>' + no + '</span></p><p>이름<br><sub>( ' + ends + ')</sub></p></th><td>' + c1 + '</td><td>' + c2 + '</td></tr>';
  }
  var NONE = "도착정보가 없습니다.";
  var html = "<table><tbody>" + row("칠곡330", "칠곡3", "동명교통↔&nbsp;동명교통", NONE, NONE) +
    row("52710", "527", "연화리2↔&nbsp;동명교통", "<font><b>7</b></font><br> 정거장전", "<font><b>10</b></font>분후<br> 도착예정") +
    row("9-310", "9-3", "북구↔&nbsp;소보", "<b>2</b> 정거장전", "곧 도착") + "</tbody></table>";
  var rows = B.parsePopup(html);
  eq("팝업 파싱: 줄 수/노선번호/id", [rows.length, rows.map(function (r) { return r.route_no; }), rows.map(function (r) { return r.route_id; })], [3, ["칠곡3", "527", "9-3"], ["칠곡330", "52710", "9-310"]]);
  eq("버스가 없으면 정거장 수/분 모두 null(0 으로 만들지 않는다)", [rows[0].stops_away, rows[0].minutes], [null, null]);
  eq("7정거장전 10분후", [rows[1].stops_away, rows[1].minutes], [7, 10]);
  eq("'곧 도착' 문구는 0분으로, 정거장 수는 그대로", [rows[2].stops_away, rows[2].minutes], [2, 0]);
  eq("방향 문구(ends)", rows[1].ends, "연화리2↔ 동명교통");

  eq("카운트다운 표기", [B.countdownText(1000 + 192000, 1000), B.countdownText(1000 + 45000, 1000), B.countdownText(1000 + 63 * 60000 + 5000, 1000), B.countdownText(500, 1000)],
     ["3분 12초 뒤", "45초 뒤", "1시간 3분 05초 뒤", "곧 도착"]);

  // ---- 정류장별 팝업 -> 노선당 한 줄(가장 빠른 버스) ----
  var cfg = { stops: { "2141": { name: "동명면우체국", route_ids: ["A", "B"] }, "2142": { name: "행정복지센터", route_ids: ["A"] }, "2479": { name: "건너2", route_ids: null } } };
  function pr(id, no, st, mi) { return { route_id: id, route_no: no, ends: "e" + id, stops_away: st, minutes: mi, text: "" }; }
  var popups = { "2141": [pr("A", "300", 7, 10), pr("B", "885", null, null), pr("C", "527", 1, 3)], "2142": [pr("A", "300", 5, 8)] };
  var got = B.buildRows(cfg, ["2141", "2142"], popups);
  eq("허용 노선만, 노선당 가장 빠른 한 줄(정류장 이름 포함), 버스 없는 노선은 줄이 없다",
     got.map(function (r) { return [r.route_id, r.minutes, r.stops_away, r.station_name]; }), [["A", 8, 5, "행정복지센터"]]);
  eq("route_ids 가 null 인 정류장(건너2)은 전 노선", B.buildRows(cfg, ["2479"], { "2479": [pr("X", "34", 3, 4), pr("Y", "36", 9, 15)] }).map(function (r) { return r.route_id; }), ["X", "Y"]);

  // ---- 사용자가 말한 규칙: 30분 전 받은 시간에서 줄이고, 못 받아도 계속 줄이고, 새 값이 오면 갱신 ----
  var MIN = 60000, T0 = 1000000, memo = {};
  var r0 = B.applyAnchors([{ route_id: "A", route_no: "300", ends: "e", station_name: "S", stops_away: 9, minutes: 30 }], memo, "dm", T0);
  eq("처음 받은 30분 -> 도착 시각 T0+30분", [r0.length, r0[0].end, !!r0[0].carried], [1, T0 + 30 * MIN, false]);
  var r1 = B.applyAnchors([], memo, "dm", T0 + 10 * MIN);
  eq("10분 뒤 못 받았으면 20분 남음으로 계속 보인다(옛 시간 - 지난 시간)", [r1.length, r1[0].end - (T0 + 10 * MIN), r1[0].carried, r1[0].stops_away], [1, 20 * MIN, true, 9]);
  var r2 = B.applyAnchors([{ route_id: "A", route_no: "300", ends: "e", station_name: "S", stops_away: 4, minutes: 12 }], memo, "dm", T0 + 20 * MIN);
  eq("다시 10분 뒤 12분이 오면 12분으로 갱신(정거장 수도 새 값)", [r2[0].end - (T0 + 20 * MIN), r2[0].stops_away, !!r2[0].carried], [12 * MIN, 4, false]);
  var r3 = B.applyAnchors([{ route_id: "A", route_no: "300", ends: "e", station_name: "S", stops_away: 4, minutes: 12 }], memo, "dm", T0 + 20 * MIN + 30000);
  eq("같은 12분이 또 와도 처음 받은 때부터 계속 줄인다(되감지 않는다)", r3[0].end, T0 + 20 * MIN + 12 * MIN);
  var r4 = B.applyAnchors([], memo, "dm", T0 + 20 * MIN + 12 * MIN + 150000);
  eq("0 을 지나도 2분 30초까지는 곧 도착으로 남는다", [r4.length, r4[0].carried], [1, true]);
  var r5 = B.applyAnchors([], memo, "dm", T0 + 20 * MIN + 12 * MIN + 181000);
  eq("0 을 지나 3분이 넘으면 놓는다", r5.length, 0);
  var m2 = {};
  B.applyAnchors([{ route_id: "A", route_no: "x", ends: "", station_name: "S", stops_away: 1, minutes: 2 }], m2, "dm", T0);
  B.applyAnchors([{ route_id: "A", route_no: "x", ends: "", station_name: "S", stops_away: 1, minutes: 5 }], {}, "hk", T0);
  eq("방향이 다르면 따로 기억한다", [B.applyAnchors([], m2, "hk", T0 + 1000).length, B.applyAnchors([], m2, "dm", T0 + 1000).length], [0, 1]);
  var m3 = {};
  B.applyAnchors([{ route_id: "A", route_no: "x", ends: "", station_name: "S", stops_away: 1, minutes: 2 }, { route_id: "B", route_no: "y", ends: "", station_name: "S", stops_away: 9, minutes: 7 }], m3, "dm", T0);
  eq("여러 노선은 도착 시각 순서로", B.applyAnchors([], m3, "dm", T0 + 1000).map(function (r) { return r.route_id; }), ["A", "B"]);

  // ---- 학명리행: 학명리 정류소(2483) 시간 - 10분, 정거장 수는 동명까지 실제 개수(사용자 지시 2026-10-24) ----
  var hk = { stops: { "2483": { name: "학명리", route_ids: ["A", "B", "C", "D"], offset_min: 10,
    gaps: { A: { stops: 9, board: "동명면행정복지센터" }, B: { stops: 8, board: "동명교통" }, C: { stops: 9, board: "동명면행정복지센터" }, D: { stops: 9, board: "동명면행정복지센터" } } } } };
  var hrows = B.buildRows(hk, ["2483"], { "2483": [pr("A", "300", 15, 20), pr("B", "36", 5, 6), pr("C", "885", 9, 9), pr("D", "34", null, 30)] });
  eq("학명리 정류소 시간에서 10분 빼고 정거장 수는 동명까지(15-9=6), 타는 곳은 동명 정류장",
     hrows.filter(function (r) { return r.route_id === "A"; }).map(function (r) { return [r.minutes, r.stops_away, r.station_name, r.estimated, r.offset_min]; }), [[10, 6, "동명면행정복지센터", true, 10]]);
  eq("이미 동명을 지난 버스(학명리까지 5정거장 < 8)는 뺀다", hrows.some(function (r) { return r.route_id === "B"; }), false);
  eq("동명 정류장에 와 있는 버스(9-9=0)는 0정거장·곧 도착(음수 시간 없음)",
     hrows.filter(function (r) { return r.route_id === "C"; }).map(function (r) { return [r.stops_away, r.minutes]; }), [[0, 0]]);
  eq("정거장 수를 모르면 지났는지 알 수 없어 시간만으로 만들지 않는다", hrows.some(function (r) { return r.route_id === "D"; }), false);
  var hm = {};
  var ha = B.applyAnchors(hrows, hm, "hk", T0);
  var hc = B.applyAnchors([], hm, "hk", T0 + 60000);
  eq("추정 표시는 못 받은 동안 이어 보여줄 때도 남는다", [ha[0].estimated, hc[0].estimated, hc[0].offset_min, hc[0].carried], [true, true, 10, true]);
  var hcard = B.renderCard("hakmyeong", [Object.assign({}, hrows[0], { end: Date.now() + 600000, carried: false, lastAt: Date.now() })], { failed: 0, total: 1 }, Date.now());
  eq("학명리행 줄: 동명까지 정거장 수 + 동명 정류장 + '학명리 정류소 시간 -10분' 표시, '학명리에서 타기'는 없다",
     [hcard.indexOf("6정류장 전") >= 0, hcard.indexOf("동명면행정복지센터에서 타기") >= 0, hcard.indexOf("학명리 정류소 시간 −10분") >= 0, hcard.indexOf("학명리에서 타기") >= 0], [true, true, true, false]);

  // ---- 화면 ----
  var card = B.renderCard("dongmyeong", [{ route_id: "A", route_no: "300", ends: "가산2리한듬↔북부정류장", station_name: "건너2", stops_away: 7, end: Date.now() + 192000, carried: false }], { failed: 0, total: 1 }, Date.now());
  eq("시간이 있어도 N정류장 전은 항상 보인다 + timer/data-end (기존 앱과 같은 말)", [card.indexOf("7정류장 전") >= 0, card.indexOf('role="timer"') >= 0, card.indexOf("data-end=") >= 0, /\d분 \d\d초 뒤/.test(card)], [true, true, true, true]);
  var held = B.renderCard("dongmyeong", [{ route_id: "A", route_no: "300", ends: "", station_name: "건너2", stops_away: 7, end: Date.now() + 90000, carried: true, lastAt: new Date(2026, 9, 23, 15, 41, 5).getTime() }], { failed: 2, total: 5 }, Date.now());
  eq("직전 값을 이어 보여줄 땐 몇 시 기준인지 알려주고 카운트다운은 그대로", [held.indexOf("15:41") >= 0, held.indexOf("data-end=") >= 0], [true, true]);
  eq("버스 없고 다 받았으면 '지금 오는 버스 없음'", B.renderCard("dongmyeong", [], { failed: 0, total: 5 }, Date.now()).indexOf("지금 오는 버스 없음") >= 0, true);
  eq("버스 없고 호출도 실패했으면 없다고 하지 않고 못 받았다고 한다", [B.renderCard("dongmyeong", [], { failed: 5, total: 5 }, Date.now()).indexOf("지금 오는 버스 없음") >= 0, B.renderCard("dongmyeong", [], { failed: 5, total: 5 }, Date.now()).indexOf("못 받았어요") >= 0], [false, true]);

  // ---- 기존 앱과 같은 디자인: 카드 제목/출처 문구, 위 시간표 박스 펴기·접기 ----
  eq("카드 제목은 기존 앱과 같다 + 출처는 칠곡군 버스정보시스템", [card.indexOf("동명 가는 버스") >= 0, card.indexOf("칠곡군 버스정보시스템") >= 0], [true, true]);
  var st2 = { dongmyeong: [{ routeno: "300", avg_time: "10:53", min_time: "10:50", max_time: "10:56", sample_count: 2 }], hakmyeong: [] };
  var bf = B.renderTimeBox("dongmyeong", st2, true), bo = B.renderTimeBox("dongmyeong", st2, false);
  eq("시간표 박스: 접으면 '눌러서 펼치기', 펴면 표(버스|평균|최소~최대), 터치 대상 표시",
     [bf.indexOf("<table") >= 0, bf.indexOf("눌러서 펼치기") >= 0, bo.indexOf("<table") >= 0, bo.indexOf("300번") >= 0, bo.indexOf("10:50~10:56") >= 0,
      bf.indexOf('data-fold="dongmyeong"') >= 0, bf.indexOf('aria-expanded="false"') >= 0, bo.indexOf('aria-expanded="true"') >= 0], [false, true, true, true, true, true, true, true]);
  eq("기록이 없으면 박스는 남고 안내 문구", B.renderTimeBox("hakmyeong", st2, false).indexOf("기록이 모이는 중") >= 0, true);
  // ---- 대구 버스정보시스템(칠곡3·급행9-3) ----
  var dj = { header: { success: true }, body: { block: false, list: [
    { routeId: "4090003014", routeNo: "칠곡3", routeNote: "동명-칠곡시장-동명-경운대-예술대-동명", bsGap: 49, bsNm: "칠곡경북대병원", vhcNo2: "2673", arrState: "60분" },
    { routeId: "1000009300", routeNo: "급행9-3", bsGap: -2, bsNm: "14:55 기점출발예정", arrState: "기점출발예정" },
    { routeId: "4090003021", routeNo: "칠곡3", routeNote: "동명-기성-동명", bsGap: 2, bsNm: "x", arrState: "곧 도착" },
    { routeId: "3000527000", routeNo: "527", bsGap: 4, bsNm: "영진주유소", arrState: "5분" } ] } };
  var dr = B.parseDaegu(dj);
  eq("대구 응답 -> 줄(노선 id 앞에 dgb:, 정류장 수, 분)", dr.map(function (r) { return [r.route_id, r.route_no, r.stops_away, r.minutes]; }),
     [["dgb:4090003014", "칠곡3", 49, 60], ["dgb:1000009300", "급행9-3", null, null], ["dgb:4090003021", "칠곡3", 2, 0], ["dgb:3000527000", "527", 4, 5]]);
  eq("기점출발예정(아직 안 떠난 차)은 시간을 만들지 않는다 / 빈 응답은 빈 목록", [dr[1].minutes, B.parseDaegu({ body: {} }).length, B.parseDaegu(null).length], [null, 0, 0]);
  var dcfg = { stops: {
    "dgb:7181001900": { name: "학명리 건너2", route_ids: null, route_nos: ["칠곡3", "급행9-3"] },
    "dgb:3690003070": { name: "학명리", route_ids: ["dgb:4090003014"], route_nos: ["칠곡3", "급행9-3"], offset_min: 10,
      gaps: { "dgb:4090003014": { stops: 8, board: "동명면행정복지센터" } } } } };
  eq("동명행(대구 건너2): 칠곡3·급행9-3 만, 다른 노선(527)은 칠곡 시스템 몫이라 뺀다",
     B.buildRows(dcfg, ["dgb:7181001900"], { "dgb:7181001900": dr }).map(function (r) { return r.route_id; }), ["dgb:4090003014", "dgb:4090003021"]);
  eq("학명리행(대구 학명리): 학명리 가는 칠곡3 만, 60-10=50분, 49-8=41정류장, 동명면행정복지센터에서 타기",
     B.buildRows(dcfg, ["dgb:3690003070"], { "dgb:3690003070": dr }).map(function (r) { return [r.route_id, r.minutes, r.stops_away, r.station_name]; }),
     [["dgb:4090003014", 50, 41, "동명면행정복지센터"]]);
  // 동명면행정복지센터(8)는 지났지만 동명교통(7) 앞인 버스: 동명교통에서 타기, 시간은 10*7/8 -> 9분을 뺀다
  var acfg = { stops: { "dgb:3690003070": { name: "학명리", route_ids: ["dgb:4090003014"], route_nos: ["칠곡3"], offset_min: 10,
    gaps: { "dgb:4090003014": { stops: 8, board: "동명면행정복지센터", alts: [{ stops: 7, board: "동명교통" }] } } } } };
  var at = function (gap, min) { return { "dgb:3690003070": [{ route_id: "dgb:4090003014", route_no: "칠곡3", ends: "", stops_away: gap, minutes: min, text: min + "분" }] }; };
  eq("동명교통에 있는 칠곡3(학명리까지 7정거장/9분) -> 동명교통 정류장에 있음, 0분, -9분",
     B.buildRows(acfg, ["dgb:3690003070"], at(7, 9)).map(function (r) { return [r.stops_away, r.minutes, r.station_name, r.offset_min]; }),
     [[0, 0, "동명교통", 9]]);
  eq("아직 행정복지센터 앞이면 그대로 행정복지센터 기준(-10분) / 동명을 다 지났으면(6정거장) 안 보인다",
     [B.buildRows(acfg, ["dgb:3690003070"], at(12, 16)).map(function (r) { return [r.stops_away, r.minutes, r.station_name]; }),
      B.buildRows(acfg, ["dgb:3690003070"], at(6, 7)).length],
     [[[4, 6, "동명면행정복지센터"]], 0]);
  // 앱을 다시 열어도 받은 시간을 이어서 줄인다: 저장한 기억을 읽고, 도착 시각 + 3분이 지난 것만 버린다
  var TT = 5000000;
  eq("저장한 기억 읽기(지난 것·깨진 값은 버림)",
     [B.loadAnchorMemo(JSON.stringify({ "hakmyeong:dgb:1": { end: TT + 60000, raw: 600, last: { route_no: "칠곡3" }, lastAt: TT - 540000 },
                                        "hakmyeong:dgb:2": { end: TT - 180001, raw: 60, last: {}, lastAt: TT - 240000 } }), TT),
      B.loadAnchorMemo("{깨짐", TT), B.loadAnchorMemo(null, TT)],
     [{ "hakmyeong:dgb:1": { end: TT + 60000, raw: 600, last: { route_no: "칠곡3" }, lastAt: TT - 540000 } }, {}, {}]);
  // 2026-10-24 16:09 실제: 버스는 보이는데(3정류장 전) 이번엔 분이 안 왔다 -> 앞서 받은 시간을 이어서 줄인다
  var nm = {}, row = function (min, away) { return [{ route_id: "dgb:4090003014", route_no: "칠곡3", ends: "", station_name: "학명리 건너2", stops_away: away, minutes: min }]; };
  B.applyAnchors(row(5, 6), nm, "dongmyeong", TT);
  var kept = B.applyAnchors(row(null, 3), nm, "dongmyeong", TT + 120000);
  eq("분이 안 온 줄은 기억한 도착 시각을 쓰고 정류장 수는 새 값", [kept[0].end, kept[0].stops_away, kept[0].carried], [TT + 300000, 3, false]);
  var fresh = B.applyAnchors(row(null, 3), {}, "dongmyeong", TT);
  eq("기억이 없으면 시간 없이 정류장 수만", [fresh[0].end, fresh[0].stops_away], [null, 3]);
  // 885 는 동명 종점에서 바로 돌아 학명리 방향으로 간다(사용자 2026-10-24): 동명행으로 학명리 건너2 를 지나는 885 를 학명리행 카드에도 보여준다
  var tcfg = { stops: { "2479": { direction: "dongmyeong", name: "학명리 건너2", route_ids: null } },
    turnaround: [{ direction: "hakmyeong", station: "2479", route_id: "88510", route_no: "885", extra_stops: 6, terminal: "동명면우체국" }] };
  var tp = { "2479": [{ route_id: "88510", route_no: "885", ends: "구미역↔동명", stops_away: 44, minutes: 60 }, { route_id: "30010", route_no: "300", ends: "", stops_away: 5, minutes: 9 }] };
  eq("학명리행: 동명 종점으로 오는 885 (종점까지 50정류장, 학명리 건너2 지나는 시간 60분)",
     B.turnaroundRows(tcfg, "hakmyeong", tp).map(function (r) { return [r.route_id, r.route_no, r.stops_away, r.minutes, r.turn.terminal, r.turn.pass]; }),
     [["88510", "885", 50, 60, "동명면우체국", "학명리 건너2"]]);
  eq("동명행 카드에는 안 붙고, 정류장을 못 받았으면 없다", [B.turnaroundRows(tcfg, "dongmyeong", tp).length, B.turnaroundRows(tcfg, "hakmyeong", {}).length], [0, 0]);
  var tr = B.applyAnchors(B.turnaroundRows(tcfg, "hakmyeong", tp), {}, "hakmyeong", TT);
  var th = B.renderCard("hakmyeong", tr, { failed: 0, total: 2 }, TT);
  eq("카드: '동명 50정류장 전' 크게 + 학명리 건너2 지나는 시간(받은 값) + 학명리 방향 출발 안내",
     [th.indexOf("동명 50정류장 전") >= 0, th.indexOf("학명리 건너2 지나는 시간") >= 0, th.indexOf("1시간 0분 00초 뒤") >= 0,
      th.indexOf("동명 종점에서 바로 학명리 방향으로 출발") >= 0, th.indexOf("학명리 정류소 시간") < 0],
     [true, true, true, true, true]);
  // 기존 앱(index.html)이 이 모듈을 같이 불러 시간을 받아 쓴다: 전역 이름을 만들면 app.js 함수와 섞인다
  eq("bis.js 는 전역 이름을 만들지 않는다", [typeof window.parsePopup, typeof window.esc, typeof window.renderCard, typeof window.countdownText, typeof window.CARD_INFO],
     ["undefined", "undefined", "undefined", "undefined", "undefined"]);
  eq("방향별 줄 = 정류장 줄 + 왕복 줄(기존 앱도 이걸 쓴다)", B.directionRows(tcfg, "hakmyeong", tp).map(function (r) { return [r.route_no, r.stops_away]; }), [["885", 50]]);
  eq("정류장 받기 함수도 내보낸다", typeof B.fetchStop, "function");
  out.push(fails ? "=== " + fails + " FAILED" : "=== ALL PASSED");
  document.getElementById("out").textContent = out.join("\n");
})();
