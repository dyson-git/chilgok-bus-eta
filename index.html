<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>칠곡 버스 도착</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1565c0">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root { --bg:#fff; --fg:#1b1b1f; --muted:#5f6368; --card:#f2f4f8; --accent:#1565c0; --accent-fg:#fff; --warn-bg:#fff3cd; --warn-fg:#664d03; --err-bg:#fde7e9; --err-fg:#8a1c24; --line:#d8dce3; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#121316; --fg:#ececf0; --muted:#a0a4ad; --card:#1d2026; --accent:#5b9dff; --accent-fg:#06121f; --warn-bg:#40330a; --warn-fg:#ffe08a; --err-bg:#45171b; --err-fg:#ffb3b8; --line:#33373f; }
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, "Noto Sans KR", "Malgun Gothic", sans-serif; }
main { max-width:560px; margin:0 auto; padding:12px 16px calc(24px + env(safe-area-inset-bottom)); }
h1 { font-size:20px; margin:4px 0 12px; }
h2 { font-size:17px; margin:0 0 8px; }
section { background:var(--card); border-radius:12px; padding:12px 14px; margin-bottom:12px; }
.dirs { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
.dirs button { min-height:56px; font-size:18px; font-weight:700; border-radius:12px; border:2px solid var(--accent); background:transparent; color:var(--accent); cursor:pointer; }
.dirs button[aria-pressed="true"] { background:var(--accent); color:var(--accent-fg); }
.row { display:flex; justify-content:space-between; align-items:baseline; gap:8px; padding:9px 0; border-top:1px solid var(--line); }
h2 + .row { border-top:0; }
.row b { font-size:20px; }
.range, .muted { color:var(--muted); font-size:14px; }
.notice { border-radius:8px; padding:10px 12px; margin:8px 0; font-size:15px; }
.notice.stale { background:var(--warn-bg); color:var(--warn-fg); font-weight:700; }
.notice.error { background:var(--err-bg); color:var(--err-fg); font-weight:700; }
.bus { font-size:18px; }
#refresh { width:100%; min-height:52px; font-size:17px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
details#reference { background:var(--card); border-radius:12px; padding:12px 14px; margin-top:12px; }
details#reference[hidden] { display:none; }
#reference summary { cursor:pointer; font-weight:700; font-size:17px; min-height:32px; }
.rt { padding:9px 0; border-top:1px solid var(--line); }
.trip { font-size:15px; padding-left:8px; overflow-wrap:anywhere; }
</style>
</head>
<body>
<main>
  <h1>칠곡 버스 도착</h1>
  <section id="timetable" aria-live="polite"><p class="muted">불러오는 중…</p></section>
  <div class="dirs" role="group" aria-label="방향 선택">
    <button type="button" data-dir="hakmyeong" aria-pressed="true">동명 출발 (학명리행)</button>
    <button type="button" data-dir="dongmyeong" aria-pressed="false">학명리 출발 (동명행)</button>
  </div>
  <section id="live" aria-live="polite"><p class="muted">불러오는 중…</p></section>
  <button type="button" id="refresh">새로고침</button>
  <details id="reference" hidden>
    <summary>참고 시간표 (기점·종점 기준)</summary>
    <div id="refbody"></div>
  </details>
</main>
<script src="live-config.js"></script>
<script src="app.js"></script>
</body>
</html>
