<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>동명 · 학명리 버스 (칠곡)</title>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#0d47a1">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<style>
:root { --bg:#fff; --fg:#111; --muted:#4a4f57; --card:#eef3fb; --accent:#0d47a1; --accent-fg:#fff; --warn-bg:#fff0c2; --warn-fg:#4d3600; --line:#b9c4d6; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#0b0c0f; --fg:#f5f5f7; --muted:#b4b8c0; --card:#1a1e26; --accent:#7db3ff; --accent-fg:#06121f; --warn-bg:#4a3a08; --warn-fg:#ffe9a6; --line:#3d4452; }
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:20px/1.5 system-ui, -apple-system, "Noto Sans KR", "Malgun Gothic", sans-serif; }
main { max-width:560px; margin:0 auto; padding:12px 16px calc(32px + env(safe-area-inset-bottom)); }
h1 { font-size:26px; margin:6px 0 14px; }
h2 { font-size:24px; margin:0; }
.card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:16px; }
.sub { color:var(--muted); font-size:18px; margin:2px 0 10px; }
.bus { display:flex; justify-content:space-between; align-items:baseline; gap:8px; padding:10px 0; border-top:1px solid var(--line); font-size:30px; font-weight:700; }
.bus .when { color:var(--accent); font-variant-numeric:tabular-nums; }
.where { color:var(--muted); font-size:18px; margin:-6px 0 8px; }
.times { width:100%; border-collapse:collapse; font-size:24px; font-weight:700; }
.times th { text-align:left; color:var(--muted); font-size:16px; font-weight:700; padding:4px 4px 6px; border-bottom:2px solid var(--line); }
.times td { padding:10px 4px; border-top:1px solid var(--line); }
.times td small { display:block; color:var(--muted); font-size:14px; font-weight:400; }
.none { font-size:26px; padding:10px 0; border-top:1px solid var(--line); }
.warn { background:var(--warn-bg); color:var(--warn-fg); border-radius:10px; padding:10px 12px; margin:8px 0; font-size:20px; font-weight:700; }
.note { color:var(--muted); font-size:16px; margin:6px 0 0; }
#refresh { width:100%; min-height:72px; font-size:28px; font-weight:700; border-radius:16px; border:0; background:var(--accent); color:var(--accent-fg); cursor:pointer; }
#refresh:disabled { opacity:.6; cursor:default; }
#checked { text-align:center; color:var(--muted); font-size:18px; margin:8px 0 20px; }
.fold { margin-bottom:12px; background:var(--card); border-radius:16px; }
.fold > button { width:100%; min-height:60px; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 16px; font:inherit; font-size:22px; font-weight:700; color:var(--fg); background:transparent; border:0; border-radius:16px; cursor:pointer; text-align:left; }
.fold svg { width:28px; height:28px; flex:none; stroke:var(--accent); fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
.fold .body { padding:0 16px 14px; }
.slot { padding:10px 0; border-top:1px solid var(--line); }
.slot .avg { font-size:28px; font-weight:800; }
.slot .rng { font-size:22px; }
.slot small { display:block; color:var(--muted); font-size:16px; }
.fold.small > button { font-size:17px; min-height:56px; font-weight:600; }
.rt { padding:9px 0; border-top:1px solid var(--line); font-size:16px; }
.trip { padding-left:8px; overflow-wrap:anywhere; }
.muted { color:var(--muted); font-size:16px; }
</style>
</head>
<body data-app="bis">
<main>
  <h1>시간표</h1>
  <div id="times"></div>
  <section class="card" id="card-dongmyeong" aria-live="polite"><p class="note">확인 중…</p></section>
  <section class="card" id="card-hakmyeong" aria-live="polite"><p class="note">확인 중…</p></section>
  <button type="button" id="refresh">새로고침</button>
  <p id="checked"></p>
</main>
<script src="../live-config.js"></script>
<script src="bis.js"></script>
</body>
</html>
