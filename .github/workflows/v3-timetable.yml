name: v3 timetable

# v3 시간표(v3/busv3). 매시간:
#  1) 55분 동안 2분마다 칠곡·대구 버스정보시스템을 받아 임시 파일에 모은다(busv3.collect) - TAGO 가 빠뜨리는 버스도 남기려고
#  2) Worker KV 의 TAGO 5분 수집을 가져오고, 둘을 합쳐 도착·시간표를 만들어 v3/data 에 커밋한다(busv3.update)
# GitHub 예약 실행(cron)은 늦거나 빠지는 일이 잦다(10/25 12~13시 한 번도 안 돎). 그래서 시작하자마자 다음 실행을 직접 예약해
# 이어 달리기로 돈다(같은 그룹이라 이번 실행이 끝나야 시작). cron 은 끊겼을 때 다시 잇는 용도.
# 원본 data/ 와 import.yml 은 건드리지 않는다. 올리는 사이 다른 커밋이 끼면 새로 받아 처음부터 다시(최대 3번).
on:
  schedule:
    - cron: "0 21-23,0-12 * * *"   # 한국 06~21시 정각(그 한 시간을 받는다)
  workflow_dispatch:
    inputs:
      minutes:
        description: "버스정보시스템을 받을 시간(분)"
        default: "55"

permissions:
  contents: write
  actions: write

concurrency:
  group: v3-timetable
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Queue the next hour
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          h=$(TZ=Asia/Seoul date +%H)
          if [ "$h" -ge 6 ] && [ "$h" -lt 21 ]; then gh workflow run v3-timetable.yml -R "$GITHUB_REPOSITORY" --ref main || echo "queue failed"; fi
      - name: Collect bus info systems
        working-directory: v3
        run: python -m busv3.collect "$RUNNER_TEMP/bis.jsonl" "${{ github.event.inputs.minutes || '55' }}" 120
      - name: Build and commit v3 timetable
        working-directory: v3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --hard origin/main
            python -m busv3.update --bis "$RUNNER_TEMP/bis.jsonl"
            git add data
            if git diff --cached --quiet -- data/obs data/bis data/arrivals.json data/stats.json; then echo "no change"; exit 0; fi
            git commit -m "v3 data: $(TZ=Asia/Seoul date +%Y-%m-%dT%H:%M)"
            if git push origin HEAD:main; then exit 0; fi
            echo "push raced (attempt $attempt), retrying"
            sleep $((attempt * 15))
          done
          exit 1
