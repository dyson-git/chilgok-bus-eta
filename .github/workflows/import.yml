name: import

# 클라우드 수집 가져오기: Cloudflare Worker 가 5분마다 KV 에 쌓은 TAGO 도착정보(수집 시간 한국 06:00~22:00)를
# 1시간마다 가져와 data/observations 에 기록하고 시간표를 다시 만든다(collector/cloud_import.py). PC 를 꺼도 기록이 이어진다.
on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Import cloud snapshots
        run: python -m collector.cloud_import
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d data ]; then git add data; fi
          if git diff --cached --quiet; then echo "no data change"; exit 0; fi
          git commit -m "data: import $(TZ=Asia/Seoul date +%Y-%m-%dT%H:%M)"
          git pull --rebase origin main
          git push origin HEAD:main
